<label
  class="computer-use-badge"
  [class.elevated]="presentation().relation === 'elevated'"
  [class.lowered]="presentation().relation === 'lowered'"
  [class.has-error]="error()"
>
  <span aria-hidden="true">CU</span>
  <select
    aria-label="Computer Use policy for this session"
    [appTooltip]="title()"
    [attr.aria-describedby]="error() ? descriptionId() + ' ' + errorId() : descriptionId()"
    [value]="presentation().selection"
    [disabled]="pending()"
    (change)="changeMode($event)"
  >
    <option value="global">Global · {{ globalLevel() }}</option>
    <option value="guarded">Session · guarded</option>
    <option value="trusted">Session · trusted</option>
    <option value="unrestricted">Session · unrestricted</option>
  </select>
  <span class="computer-use-lifecycle" [id]="descriptionId()">next call · no restart · session only</span>
  @if (presentation().relation === 'elevated') {
    <span class="computer-use-lifecycle">Elevated permissions are active for this session.</span>
  } @else if (presentation().relation === 'lowered') {
    <span class="computer-use-lifecycle">This session is more restricted than the global default.</span>
  }
  @if (error(); as message) {
    <span class="computer-use-error" [id]="errorId()" role="status" aria-live="polite">{{ message }}</span>
  }
</label>
