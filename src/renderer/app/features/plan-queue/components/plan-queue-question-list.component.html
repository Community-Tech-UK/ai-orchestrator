<div class="pq-question-list">
  @for (group of renderedGroups(); track group.key) {
    <details class="pq-question-group" [open]="!!expandedForDocument() || isInitiallyOpen(group.runId)">
      <summary class="pq-question-group-head">
        <span class="pq-question-group-kind">{{ kindLabel(group.kind) }}</span>
        <span class="pq-question-group-cwd" tabindex="0" [appTooltip]="group.workspaceCwd" appTooltipVariant="overflow">{{ group.workspaceCwd }}</span>
        <span class="pq-question-group-count">{{ pluralise(group.items.length, 'question') }}</span>
      </summary>
      <div class="pq-question-group-items">
        @for (item of group.items; track item.id) {
          @if (item.question) {
            <div class="pq-question-item">
              <div class="pq-question-doc" tabindex="0" [appTooltip]="item.sourceRef">{{ documentBasename(item.sourceRef) }}</div>
              <app-plan-queue-question-card [question]="item.question" (submitAnswer)="onAnswer(item.id, $event)" />
            </div>
          }
        }
      </div>
    </details>
  }
</div>
