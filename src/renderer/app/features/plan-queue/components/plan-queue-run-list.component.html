<div class="pq-run-list">
  @for (run of runs(); track run.id) {
    <div class="pq-run" [attr.data-status]="run.status">
      <div class="pq-run-head">
        <span class="pq-run-kind">{{ run.kind }}</span>
        <span class="pq-run-cwd" [title]="run.workspaceCwd">{{ run.workspaceCwd }}</span>
        <span class="pq-run-started">Started {{ formatStartedAt(run.startedAt) }}</span>
        <app-plan-queue-run-controls
          [run]="run"
          (pauseRun)="pauseRun.emit($event)"
          (resumeRun)="resumeRun.emit($event)"
          (cancelRun)="cancelRun.emit($event)"
        />
      </div>

      <details class="pq-run-documents">
        <summary>
          <span class="pq-run-item-count">{{ run.items.length }} document(s)</span>
          @if (run.items.length > 0) {
            <span class="pq-run-state-counts">{{ stateCounts(run.items) }}</span>
          }
        </summary>
        <app-plan-queue-item-list [items]="run.items" (skipItem)="skipItem.emit($event)" />
      </details>
    </div>
  }
</div>
